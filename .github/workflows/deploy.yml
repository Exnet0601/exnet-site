name: Deploy to Lolipop

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: python3 src/build.py

      - name: Check FTP settings
        id: cfg
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_SERVER_DIR" ]; then
            echo "::notice::FTP の Secrets が未設定のため、アップロードを飛ばしました。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the preview out of search results
        if: steps.cfg.outputs.ready == 'true'
        env:
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          if [ "$FTP_SERVER_DIR" != "exnet/" ]; then
            sed -i 's|<head>|<head><meta name="robots" content="noindex, nofollow">|' site/*.html
            echo "::notice::確認用のフォルダなので、検索に載らない設定を入れました。"
          fi

      - name: Upload to Lolipop
        if: steps.cfg.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
