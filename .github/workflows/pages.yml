name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: python3 src/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 本番のサイトマップはキャッシュで古いことがあるので、いまビルドしたものからURLを取る
      - name: Build site
        run: python3 src/build.py

      - name: Notify IndexNow
        run: |
          URLS=$(grep -o '<loc>[^<]*' site/sitemap.xml | sed 's/<loc>//' | jq -R . | jq -sc .)
          COUNT=$(echo "$URLS" | jq length)
          echo "URLs: $COUNT"
          if [ "$COUNT" -eq 0 ]; then echo "サイトマップにURLがありません"; exit 1; fi
          sleep 30
          CODE=$(curl -s -o response.txt -w "%{http_code}" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"exnet.biz\",\"key\":\"45fcc86aa1ac446187856ad617221133\",\"keyLocation\":\"https://exnet.biz/45fcc86aa1ac446187856ad617221133.txt\",\"urlList\":$URLS}")
          echo "IndexNow: $CODE"
          cat response.txt
          case "$CODE" in 2??) ;; *) echo "IndexNow が受け付けませんでした"; exit 1;; esac
